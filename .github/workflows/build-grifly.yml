          PATCH
          git apply "$RUNNER_TEMP/premium.patch"
          test "$(git hash-object s-browser/app/build.gradle)" = d81a32630834231b4ed6efbd38d0f3ae9bce6b0e
          test "$(git hash-object s-browser/app/src/main/java/com/saurabhsvision/sbrowser/MainActivity.java)" = 14b10f1bea672de64ecbf78aaae689db29c32c7b
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK
        run: |
          sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Restore owner signing key if configured
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.GRIFLY_SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/grifly-stable-signing.jks"
            chmod 600 "$RUNNER_TEMP/grifly-stable-signing.jks"
          else
            echo "::warning::Debug signed; in-place upgrade depends on matching existing signing key."
          fi
      - name: Compile APK
        working-directory: s-browser
        env:
          GRIFLY_KEYSTORE_FILE: ${{ runner.temp }}/grifly-stable-signing.jks
          GRIFLY_KEYSTORE_PASSWORD: ${{ secrets.GRIFLY_SIGNING_STORE_PASSWORD }}
          GRIFLY_KEY_ALIAS: ${{ secrets.GRIFLY_SIGNING_KEY_ALIAS }}
          GRIFLY_KEY_PASSWORD: ${{ secrets.GRIFLY_SIGNING_KEY_PASSWORD }}
        run: gradle --no-daemon --stacktrace --console=plain :app:assembleDebug
      - name: Verify APK and stage output
        run: |
          mkdir -p dist
          cp s-browser/app/build/outputs/apk/debug/app-debug.apk dist/Grifly_v2.0.0_Premium_beta.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose dist/Grifly_v2.0.0_Premium_beta.apk
          cd dist
          sha256sum *.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Grifly-v2.0.0-Premium-APK
          path: dist/
          if-no-files-found: error
