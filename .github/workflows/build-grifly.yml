name: Grifly Premium Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Premium source overlay
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: overlay
      - name: Checkout owner source at verified revision
        uses: actions/checkout@v4
        with:
          repository: saurabhsahu20-svg/Saurabhs-Vision-
          ref: 09e13f72e3506f9625a2b30f4e4c1847633b4358
          persist-credentials: false
          path: source
      - name: Apply verified Premium source files
        shell: bash
        run: |
          set -euo pipefail
          cp overlay/premium/s-browser/app/build.gradle source/s-browser/app/build.gradle
          cp overlay/premium/s-browser/app/src/main/java/com/saurabhsvision/sbrowser/MainActivity.java source/s-browser/app/src/main/java/com/saurabhsvision/sbrowser/MainActivity.java
          test "$(git hash-object source/s-browser/app/build.gradle)" = 4b409f92c621770cd4caf6db8032b3693b29e6ca
          test "$(git hash-object source/s-browser/app/src/main/java/com/saurabhsvision/sbrowser/MainActivity.java)" = 7f2263d2b664c842fa9908dca9efa083bad893e5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK
        run: |
          if [ ! -f "$ANDROID_HOME/platforms/android-35/android.jar" ] || [ ! -x "$ANDROID_HOME/build-tools/35.0.0/apksigner" ]; then
            sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
          fi
      - name: Restore owner signing key if configured
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.GRIFLY_SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/grifly-stable-signing.jks"
            chmod 600 "$RUNNER_TEMP/grifly-stable-signing.jks"
          else
            echo "::warning::Debug signed; in-place upgrade depends on matching existing signing key."
          fi
      - name: Compile APK
        working-directory: source/s-browser
        env:
          GRIFLY_KEYSTORE_FILE: ${{ runner.temp }}/grifly-stable-signing.jks
          GRIFLY_KEYSTORE_PASSWORD: ${{ secrets.GRIFLY_SIGNING_STORE_PASSWORD }}
          GRIFLY_KEY_ALIAS: ${{ secrets.GRIFLY_SIGNING_KEY_ALIAS }}
          GRIFLY_KEY_PASSWORD: ${{ secrets.GRIFLY_SIGNING_KEY_PASSWORD }}
        run: gradle --no-daemon --stacktrace --console=plain :app:assembleDebug
      - name: Verify APK and stage output
        run: |
          mkdir -p dist
          cp source/s-browser/app/build/outputs/apk/debug/app-debug.apk dist/Grifly_v2.0.1_Premium_beta.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose dist/Grifly_v2.0.1_Premium_beta.apk
          cd dist
          sha256sum *.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Grifly-v2.0.1-Premium-APK
          path: dist/
          if-no-files-found: error
