name: Grifly Premium Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: grifly-build-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: overlay
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: saurabhsahu20-svg/Saurabhs-Vision-
          ref: 09e13f72e3506f9625a2b30f4e4c1847633b4358
          path: source
          persist-credentials: false
      - name: Apply Grifly source overlay
        run: |
          set -euo pipefail
          cp -a overlay/premium/s-browser/. source/s-browser/
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Run browser and student resource regression tests
        working-directory: source/s-browser
        shell: bash
        run: |
          set -euo pipefail
          src=app/src/main/java/com/saurabhsvision/sbrowser
          mkdir -p "$RUNNER_TEMP/grifly-tests"
          javac -d "$RUNNER_TEMP/grifly-tests" "$src"/{AddressResolver,UrlTools,DictionaryCore,CityNewsSources,GovtSources,DailyAssemblyContent,DailyNewsSources,DictionaryEntry,GriflyVersion,ModelPaperCatalog,NewsQualityGate}.java tests/*.java
          for f in tests/*.java; do
            java -cp "$RUNNER_TEMP/grifly-tests" "$(basename "$f" .java)"
          done
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK
        run: |
          if [ ! -f "$ANDROID_HOME/platforms/android-35/android.jar" ] || [ ! -x "$ANDROID_HOME/build-tools/35.0.0/apksigner" ]; then
            sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
          fi
      - name: Restore original signing key (if available)
        id: signing
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.GRIFLY_SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.GRIFLY_SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.GRIFLY_SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.GRIFLY_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_B64$STORE_PASSWORD$KEY_ALIAS$KEY_PASSWORD" ]; then
            echo "owner_signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No original key. Only a test APK will be produced; it will NOT be published as an update."
          elif [ -n "$KEYSTORE_B64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            umask 077
            printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/grifly-stable-signing.jks"
            echo "owner_signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Incomplete signing configuration"
            exit 1
          fi
      - name: Compile APK
        working-directory: source/s-browser
        env:
          GRIFLY_KEYSTORE_FILE: ${{ runner.temp }}/grifly-stable-signing.jks
          GRIFLY_KEYSTORE_PASSWORD: ${{ secrets.GRIFLY_SIGNING_STORE_PASSWORD }}
          GRIFLY_KEY_ALIAS: ${{ secrets.GRIFLY_SIGNING_KEY_ALIAS }}
          GRIFLY_KEY_PASSWORD: ${{ secrets.GRIFLY_SIGNING_KEY_PASSWORD }}
        run: gradle --no-daemon --stacktrace --console=plain :app:assembleDebug
      - name: Verify APK package, version and certificate
        id: verify
        env:
          OWNER_SIGNED: ${{ steps.signing.outputs.owner_signed }}
          EXPECTED_CERT: ${{ vars.GRIFLY_ORIGINAL_CERT_SHA256 }}
        shell: bash
        run: |
          set -euo pipefail
          apk=source/s-browser/app/build/outputs/apk/debug/app-debug.apk
          tools="$ANDROID_HOME/build-tools/35.0.0"
          "$tools/apksigner" verify --verbose --print-certs "$apk" > cert.txt
          cat cert.txt
          "$tools/aapt" dump badging "$apk" > badging.txt
          grep -F "package: name='com.saurabhsvision.sbrowser' versionCode='29' versionName='2.0.4-beta'" badging.txt
          mkdir -p dist
          if [ "$OWNER_SIGNED" = true ]; then
            expected="${EXPECTED_CERT:-7950d7c6bb15da8a44a05421849527213b1822c12e64f49155f048e286cc3e3b}"
            actual="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' cert.txt | head -1)"
            if [ "${actual,,}" != "${expected,,}" ]; then
              echo "::error::Signing certificate differs from the configured permanent baseline. No update will be published."
              exit 1
            fi
            cp "$apk" dist/Grifly_v2.0.4_Performance.apk
            echo "compatible=true" >> "$GITHUB_OUTPUT"
          else
            cp "$apk" dist/Grifly_v2.0.4_TEST_ONLY.apk
            echo "compatible=false" >> "$GITHUB_OUTPUT"
          fi
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: Grifly-v2.0.4-${{ steps.verify.outputs.compatible == 'true' && 'compatible-update' || 'test-only' }}
          path: dist/
          if-no-files-found: error
      - name: Publish certificate-matched update
        if: steps.verify.outputs.compatible == 'true' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag=grifly-v2.0.4
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists; not replacing a published APK."
          else
            gh release create "$tag" dist/Grifly_v2.0.4_Stability.apk dist/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Grifly 2.0.4 Performance beta" --notes "Permanent signing baseline. In-place updates work only for apps already signed with the matching key. Older differently signed installations require migration; back up important data first. Device testing remains necessary."
          fi
      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/grifly-stable-signing.jks"
